name: Run Android Linter workflow

on: [workflow_call]

jobs:
  lint:
    name: Run Android Linter
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup
      uses: ./.github/actions/setup

    - name: Run Lint
      run: ./gradlew lint

    - name: Upload Markdown Report
      if: success() || failure()
      run: |
        echo "<details>" >> $GITHUB_STEP_SUMMARY
        echo "<summary>Show Report</summary>" >> $GITHUB_STEP_SUMMARY
        sed -n '/<body/,/<\/body>/p' androidApp/build/reports/lint-results-debug.html >> $GITHUB_STEP_SUMMARY
        echo "</details>" >> $GITHUB_STEP_SUMMARY

    - name: Upload HTML Reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success() || failure()
      with:
        name: Lint-HTML
        path: androidApp/build/reports/lint-results-debug.html

    - name: Upload SARIF Report
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      if: success() || failure()
      with:
        sarif_file: androidApp/build/reports/lint-results-debug.sarif
